<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OmniCinema Booking System</title>
    <style>
        body {font-family: Arial, sans-serif; text-align: center; margin: 30px auto; max-width: 800px;}
        table {width: 100%; border-collapse: collapse; margin-bottom: 25px;}
        th, td {border: 1px solid #ddd; padding: 8px; text-align: center;}
        th {background-color: #007bff; color: white;}
        
        .selector-box {background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 20px 0; border: 1px solid #ddd;}
        select {padding: 8px; font-size: 15px; width: 300px;}

        #seat-container 
        {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 10px;
            justify-content: center;
            margin: 20px auto;
        }
        
        .seat-btn 
        {
            width: 60px;
            height: 60px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .price-card 
        {
            background-color: #e9ecef;
            border-radius: 8px;
            padding: 15px;
            display: inline-block;
            margin: 15px 0;
            text-align: left;
            width: 280px;
        }
    </style>
</head>
<body>
    <h1>OmniCinema - Ticket Booking</h1>

    <h3>Now Showing Movies</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Genre</th>
                <th>Base Price</th>
                <th>Duration</th>
            </tr>
        </thead>
        <tbody id="movies-table-body"></tbody>
    </table>

    <h3>Movie Schedules</h3>
    <table>
        <thead>
            <tr>
                <th>Schedule ID</th>
                <th>Movie Title</th>
                <th>Hall</th>
                <th>Showtime</th>
            </tr>
        </thead>
        <tbody id="schedules-table-body"></tbody>
    </table>

    <div class="selector-box">
        <label for="schedule-dropdown"><strong>Select Movie Schedule: </strong></label>
        <select id="schedule-dropdown" onchange="onScheduleChange()"></select>
    </div>

    <h3>Select Your Seat</h3>
    <div id="seat-container"></div>

    <p>Selected Seat: <strong id="selected-seat-text">None</strong></p>

    <div class="price-card">
        <div><strong>Ticket Price Summary:</strong></div>
        <hr>
        <div>Base Ticket Price: <span id="price-base">$0.00</span></div>
        <div>Discount (Under 18): <span id="price-discount">None (0%)</span></div>
        <hr>
        <div><strong>Total Owed: <span id="price-total" style="color: #007bff;">$0.00</span></strong></div>
    </div>

    <div>
        <input type="number" id="age-input" placeholder="Your Age" oninput="updatePriceSummary()" style="padding: 8px; margin: 5px; width: 100px;">
        <input type="number" id="pay-input" placeholder="Payment ($)" step="0.01" style="padding: 8px; margin: 5px; width: 100px;">
        <br><br>
        <button onclick="buyTicket()" style="padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px;">
            Pay & Purchase Seat
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
